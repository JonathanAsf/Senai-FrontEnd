<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon do Cartas</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <div class="galeria">
      <img class="img" src="./img/pokemon1.jpg" alt="" />
      <img class="img" src="./img/pokemon2.jpg" alt="" />
      <img class="img" src="./img/pokemon3.png" alt="" />
      <img class="img" src="./img/pokemon4.png" alt="" />
      <img class="img" src="./img/pokemon5.png" alt="" />
      <img class="img" src="./img/pokemon6.jpeg" alt="" />
    </div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button class="lightbox_close" aria-label="Fechar (Esc)">×</button>
      <img id="lightbox-img" class="lightbox_img" alt="Imagem ampliada" />
    </div>
  </body>
</html>
